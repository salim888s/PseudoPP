<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C93C00">
<title>Pseudo++</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --hdr:#C93C00; --bg:#F7EBE6; --text:#1F2326; --muted:#6B6360; --card:#FFFFFF;
  --btn:#FF8A3D; --btn-text:#1F2326; --ed:#22262B; --gut:#16191C; --ed-text:#F2F2F5; --num:#FFF6D6;
  --nav:#C93C00; --nav-on:#9B2D00; --line:#E8D6CE; --accent:#C93C00;
}
:root[data-theme="dark"]{
  --hdr:#8F2B00; --bg:#15171A; --text:#EDEDED; --muted:#A7A29F; --card:#1F2226;
  --btn:#E8742A; --btn-text:#16191C; --ed:#1B1E22; --gut:#101215; --nav:#8F2B00; --nav-on:#5E1B00; --line:#33373C; --accent:#FF8A3D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;transition:background .25s}
.app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
header{direction:ltr;background:var(--hdr);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;min-height:66px;border-bottom:5px solid rgba(0,0,0,.35)}
header h1{font-size:28px;font-weight:700;letter-spacing:.3px}
.hbtns{display:flex;align-items:center;gap:14px}
.hbtns button{background:none;border:0;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:16px;padding:4px}
.hbtns svg{width:32px;height:32px}
main{flex:1;overflow-y:auto;padding:18px 14px 20px}
.editor{display:flex;height:min(54vh,410px);background:var(--ed);border:2px solid transparent;direction:ltr;overflow:hidden}
.editor.focus{border-color:#1E9BE8}
.gutter{width:52px;background:var(--gut);overflow:hidden;flex-shrink:0;padding-top:12px}
.gin{white-space:pre;text-align:center;color:var(--num);font:16px/25px ui-monospace,Menlo,Consolas,monospace}
.editor textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--ed-text);font:15px/25px ui-monospace,Menlo,Consolas,monospace;padding:12px 10px;white-space:pre;overflow:auto;unicode-bidi:plaintext;text-align:start;tab-size:4}
.convrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px 0 18px;font-size:22px;font-weight:500;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:8px 14px;font:inherit;font-size:22px;cursor:pointer;direction:ltr}
:root[data-theme="dark"] .pill{background:#B44A15}
.pill svg{width:34px;height:34px}
.lb{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;direction:ltr}
.cbtn{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto;background:var(--btn);color:var(--btn-text);border:0;border-radius:14px;padding:14px 38px;font:inherit;font-size:22px;font-weight:500;cursor:pointer;min-width:200px}
.cbtn:disabled{opacity:.6;cursor:wait}
.cbtn svg{width:40px;height:40px}
.err{background:#FDECEA;color:#9C1C13;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:15px;line-height:1.7;text-align:center}
:root[data-theme="dark"] .err{background:#3A1C1A;color:#FFB4AB}
.title2{font-size:26px;font-weight:500;margin:26px 6px 14px}
.row2{display:flex;gap:14px;margin-top:20px}
.row2 button{flex:1;background:var(--btn);color:var(--btn-text);border:0;border-radius:14px;padding:16px 8px;font:inherit;font-size:19px;font-weight:500;cursor:pointer}
.link{display:block;margin:16px auto 0;background:none;border:0;color:var(--accent);font:inherit;font-size:16px;font-weight:600;cursor:pointer;text-decoration:underline}
nav{display:flex;margin:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:var(--nav);border-radius:14px;padding:6px;gap:4px}
nav button{flex:1;background:none;border:0;color:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font:inherit;font-size:15px;cursor:pointer}
nav button.on{background:var(--nav-on)}
nav svg{width:34px;height:34px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h3{font-size:19px;margin-bottom:10px}
.card p{line-height:1.9;color:var(--muted);font-size:15.5px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px}
.set:last-child{border:0}
.seg{display:flex;border:1.5px solid var(--accent);border-radius:12px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 18px;font:inherit;font-weight:600;color:var(--accent);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.sw{width:52px;height:30px;border-radius:999px;background:#B9AFAA;border:0;position:relative;cursor:pointer;flex-shrink:0;direction:ltr}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(22px)}
.dbtn{width:100%;background:none;border:1.5px solid #C0392B;color:#C0392B;border-radius:12px;padding:12px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
.hitem{display:block;width:100%;text-align:start;font:inherit;color:inherit;border:0;cursor:pointer}
.htop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.htop small{color:var(--muted);font-size:13px}
.tag{display:flex;align-items:center;gap:8px;font-weight:700;direction:ltr}
.tag .lb{width:26px;height:26px;font-size:11px}
.snip{font-size:14px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;unicode-bidi:plaintext;text-align:start}
.empty{text-align:center;color:var(--muted);padding:60px 10px;line-height:2;font-size:17px}
.hero{text-align:center;padding:10px 0 18px}
.hero .logo{display:inline-block;background:var(--hdr);color:#fff;font-size:32px;font-weight:700;padding:12px 26px;border-radius:18px;direction:ltr}
.hero small{display:block;margin-top:10px;color:var(--muted)}
.soc{display:flex;gap:12px}
.soc a{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px;border-radius:14px;color:#fff;font-weight:700;text-decoration:none;font-size:17px}
.soc svg{width:26px;height:26px}
.fb{background:#1877F2}.ig{background:linear-gradient(45deg,#F9A03F,#E1306C 50%,#833AB4)}
.qr{display:block;width:min(260px,70%);margin:12px auto;border-radius:12px;background:#fff;padding:8px}
.code{direction:ltr;text-align:center;background:var(--bg);border-radius:10px;padding:10px;font:14px ui-monospace,Menlo,monospace;word-break:break-all;margin-bottom:10px}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:78%;background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding:16px 14px calc(env(safe-area-inset-bottom) + 14px)}
.sheet input{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;margin-bottom:10px;outline:0}
.sheet input:focus{border-color:var(--accent)}
.sheet .list{overflow-y:auto}
.opt{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;color:var(--text);padding:12px 8px;border-radius:12px;font:inherit;font-size:18px;cursor:pointer;direction:ltr;text-align:left}
.opt.on,.opt:active{background:var(--bg)}
.toast{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.spin{width:26px;height:26px;border:3.5px solid rgba(0,0,0,.2);border-top-color:var(--btn-text);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
:focus-visible{outline:3px solid #1E9BE8;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Pseudo++</h1>
    <div class="hbtns">
      <button id="themeBtn" aria-label="theme"></button>
      <button id="langBtn" aria-label="language"></button>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div class="toast" id="toast"></div>
</div>

/* ===================== الحالة ===================== */
const S = {
  tab:'home', view:'edit', loading:false, error:'', sheet:false,
  lang: store.get('lang','ar'),
  theme: store.get('theme', matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'),
  comments: store.get('comments', true),
  target: store.get('target','JavaScript'),
  pseudo: store.get('pseudo',''),
  result: null
};
const t = k => I18N[S.lang][k];
const $ = s => document.querySelector(s);
const L = n => LANGS.find(l=>l.n===n) || LANGS[0];
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = l => `<span class="lb" style="background:${l.c};color:${l.tc||'#fff'}">${l.ab}</span>`;
function toast(m){ const e=$('#toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1700); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const a=document.createElement('textarea'); a.value=text; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast(t('copied'));
}

function applyPrefs(){
  const h=document.documentElement;
  h.lang=S.lang; h.dir=S.lang==='ar'?'rtl':'ltr'; h.dataset.theme=S.theme;
  $('#themeBtn').innerHTML = S.theme==='dark'?IC.sun:IC.moon;
  $('#langBtn').innerHTML = IC.globe + (S.lang==='ar'?'AR':'EN');
  $('#nav').innerHTML = [['home','home'],['settings','gear'],['history','hist'],['about','info']]
    .map(([k,i])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${IC[i]}<span>${t(k)}</span></button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; if(S.tab==='home') S.view='edit'; render(); });
}

/* ===================== المحرر برقم الأسطر ===================== */
function editorEl(id){ return `<div class="editor" id="${id}"><div class="gutter"><div class="gin"></div></div><textarea spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div>`; }
function wireEditor(id, value, readOnly, onInput, placeholder){
  const box=$('#'+id), ta=box.querySelector('textarea'), gin=box.querySelector('.gin');
  ta.value=value; ta.readOnly=!!readOnly; if(placeholder) ta.placeholder=placeholder;
  const nums=()=>{ const n=Math.max(16, ta.value.split('\n').length); gin.textContent=Array.from({length:n},(_,i)=>i+1).join('\n'); };
  const sync=()=>{ gin.style.transform=`translateY(${-ta.scrollTop}px)`; };
  ta.addEventListener('input',()=>{ nums(); onInput&&onInput(ta.value); });
  ta.addEventListener('scroll',sync);
  ta.addEventListener('focus',()=>box.classList.add('focus'));
  ta.addEventListener('blur',()=>box.classList.remove('focus'));
  ta.addEventListener('keydown',e=>{ if(e.key==='Tab'&&!readOnly){ e.preventDefault(); const s=ta.selectionStart; ta.setRangeText('    ',s,ta.selectionEnd,'end'); ta.dispatchEvent(new Event('input')); } });
  nums(); sync();
}

/* ===================== الشاشات ===================== */
function render(){
  applyPrefs();
  const m=$('#main'); m.scrollTop=0;
  if(S.tab==='home') return S.view==='result' && S.result ? viewResult(m) : viewEdit(m);
  if(S.tab==='settings') return viewSettings(m);
  if(S.tab==='history') return viewHistory(m);
  return viewAbout(m);
}

function viewEdit(m){
  const l=L(S.target);
  m.innerHTML = `
    ${editorEl('ed')}
    <div class="convrow"><span>${t('convertTo')}</span>
      <button class="pill" id="pick">${IC.down}${badge(l)}<span>${l.n}</span></button></div>
    <button class="cbtn" id="go">${IC.spark}<span id="gotxt">${t('convert')}</span></button>
    <div id="err"></div>`;
  wireEditor('ed', S.pseudo, false, v=>{ S.pseudo=v; store.set('pseudo',v); }, t('ph'));
  $('#pick').onclick=openSheet;
  $('#go').onclick=convert;
  paintState();
}
function paintState(){
  const b=$('#go'); if(!b) return;
  b.disabled=S.loading;
  b.querySelector('svg, .spin')?.remove();
  b.insertAdjacentHTML('afterbegin', S.loading?'<div class="spin"></div>':IC.spark);
  $('#gotxt').textContent = S.loading?t('converting'):t('convert');
  $('#err').innerHTML = S.error?`<div class="err">${esc(S.error)}</div>`:'';
}

function viewResult(m){
  const l=L(S.result.lang);
  m.innerHTML = `
    <div class="title2" style="margin-top:14px">${t('codeIn')} ${l.n} :</div>
    ${editorEl('out')}
    <div class="row2"><button id="cp">${t('copy')}</button><button id="dl">${t('download')} .${l.ext}</button></div>
    <button class="link" id="back">${t('edit')}</button>`;
  wireEditor('out', S.result.code, true);
  $('#cp').onclick=()=>copy(S.result.code);
  $('#dl').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([S.result.code],{type:'text/plain;charset=utf-8'}));
    a.download='code.'+l.ext; a.click(); URL.revokeObjectURL(a.href);
  };
  $('#back').onclick=()=>{ S.view='edit'; render(); };
}

function viewSettings(m){
  m.innerHTML = `<div class="card">
    <div class="set"><span>${t('lang')}</span><div class="seg"><button data-l="ar" class="${S.lang==='ar'?'on':''}">العربية</button><button data-l="en" class="${S.lang==='en'?'on':''}">English</button></div></div>
    <div class="set"><span>${t('theme')}</span><button class="sw ${S.theme==='dark'?'on':''}" id="swTheme" role="switch" aria-checked="${S.theme==='dark'}"></button></div>
    <div class="set"><span>${t('comments')}</span><button class="sw ${S.comments?'on':''}" id="swCom" role="switch" aria-checked="${S.comments}"></button></div>
  </div>
  <button class="dbtn" id="clr">${t('clear')}</button>`;
  m.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  $('#swTheme').onclick=toggleTheme;
  $('#swCom').onclick=()=>{ S.comments=!S.comments; store.set('comments',S.comments); render(); };
  $('#clr').onclick=()=>{ store.set('history',[]); toast(t('cleared')); };
}

function viewHistory(m){
  const h=store.get('history',[]);
  if(!h.length){ m.innerHTML=`<div class="empty">${t('noHist')}</div>`; return; }
  m.innerHTML = h.map((x,i)=>{ const l=L(x.lang); return `
    <button class="card hitem" data-i="${i}">
      <div class="htop"><span class="tag">${badge(l)}${l.n}</span><small>${new Date(x.t).toLocaleString(S.lang==='ar'?'ar':'en',{dateStyle:'medium',timeStyle:'short'})}</small></div>
      <div class="snip">${esc(x.pseudo)}</div></button>`; }).join('');
  m.querySelectorAll('.hitem').forEach(b=>b.onclick=()=>{
    const x=h[b.dataset.i]; S.pseudo=x.pseudo; S.target=x.lang; S.result={code:x.code,lang:x.lang};
    store.set('pseudo',S.pseudo); store.set('target',S.target);
    S.tab='home'; S.view='result'; render();
  });
}

function viewAbout(m){
  m.innerHTML = `
    <div class="hero"><span class="logo">Pseudo++</span><small>${t('version')}</small></div>
    <div class="card"><h3>${t('aboutT')}</h3><p>${t('aboutP')}</p></div>
    <div class="card"><h3>${t('follow')}</h3>
      <div class="soc">
        <a class="fb" href="${FACEBOOK_URL}" target="_blank" rel="noopener">${IC.fb}Facebook</a>
        <a class="ig" href="${INSTAGRAM_URL}" target="_blank" rel="noopener">${IC.ig}Instagram</a>
      </div></div>
    <div class="card"><h3>${t('support')} — Sham Cash</h3><p>${t('supportP')}</p>
      <img class="qr" src="${QR_IMG}" alt="Sham Cash QR">
      <div class="code">${SHAMCASH_CODE}</div>
      <button class="cbtn" id="cpc" style="font-size:18px;padding:12px 26px;min-width:0">${t('copyCode')}</button>
    </div>`;
  $('#cpc').onclick=()=>copy(SHAMCASH_CODE);
}

/* ===================== اختيار اللغة ===================== */
function openSheet(){
  const bg=document.createElement('div'); bg.className='sheetbg';
  bg.innerHTML=`<div class="sheet"><input id="sq" placeholder="${t('searchLang')}"><div class="list" id="sl"></div></div>`;
  $('.app').appendChild(bg);
  const draw=()=>{
    const q=$('#sq').value.trim().toLowerCase();
    $('#sl').innerHTML=LANGS.filter(l=>l.n.toLowerCase().includes(q)).map(l=>`<button class="opt ${l.n===S.target?'on':''}" data-n="${l.n}">${badge(l)}<span>${l.n}</span></button>`).join('')||`<div class="empty">${t('empty')}</div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ S.target=b.dataset.n; store.set('target',S.target); bg.remove(); render(); });
  };
  bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  $('#sq').oninput=draw; draw();
}

/* ===================== الوظائف ===================== */
function setLang(l){ S.lang=l; store.set('lang',l); render(); }
function toggleTheme(){ S.theme=S.theme==='dark'?'light':'dark'; store.set('theme',S.theme); render(); }
$('#themeBtn').onclick=toggleTheme;
$('#langBtn').onclick=()=>setLang(S.lang==='ar'?'en':'ar');

async function convert(){
  const text=S.pseudo.trim();
  if(!text){ S.error=t('emptyInput'); paintState(); return; }
  S.loading=true; S.error=''; paintState();
  const target=S.target;
  const sys=`You are a precise translator from pseudocode to real, runnable code. The input may be Arabic, English, or mixed.
Convert it to ${target}. ${target==='HTML'?'Return one complete HTML document (HTML, CSS and JS inline if needed).':'Return a complete, runnable program.'}
${S.comments?'Add short helpful comments in the same language as the input.':'Do not add comments.'}
Output ONLY the code. No markdown fences, no explanations.`;
  try{
    const keys=getKeys(); let code='', netFail=false, done=false;
    // تبديل تلقائي: المفتاح 1 ثم 2، ثم النموذج الاحتياطي، عند تجاوز الحد أو كبر الطلب
    outer: for(const model of MODELS){
      for(const key of keys){
        let r;
        try{
          r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
            body:JSON.stringify({model,temperature:0.2,max_completion_tokens:16000,reasoning_effort:'medium',
              messages:[{role:'system',content:sys},{role:'user',content:text}]})
          });
        }catch(e){ netFail=true; continue; }
        if([401,403,413,429,498,500,502,503].includes(r.status)) continue;
        if(!r.ok) continue;
        const d=await r.json();
        code=(d.choices?.[0]?.message?.content||'').trim();
        if(code){ done=true; break outer; }
      }
    }
    if(!done) throw (netFail ? new TypeError('net') : new Error('api'));
    code=code.replace(/^```[\w+#-]*\n?/,'').replace(/\n?```$/,'');
    S.result={code,lang:target};
    const h=store.get('history',[]);
    h.unshift({t:Date.now(),lang:target,pseudo:text,code});
    store.set('history',h.slice(0,50));
    S.loading=false; S.view='result'; render(); return;
  }catch(e){
    S.error = e instanceof TypeError ? t('netErr') : t('fail');
  }
  S.loading=false; paintState();
}

render();
</script>
